name: QuorumMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit and integration tests
        run: npm test -- --run

      - name: Run deterministic quality audit
        run: npm run quality:audit

      - name: Run deterministic mock E2E
        run: npm run mock:e2e

      - name: Build
        run: npm run build

      - name: Run browser visual audit
        run: npm run visual:audit

      - name: Upload visual audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-artifacts
          path: |
            output/playwright/visual-audit
            docs/quality/2026-06-17-visual-audit.md
          if-no-files-found: ignore

      - name: Check whitespace in diff
        run: git diff --check
