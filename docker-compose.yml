services:
  quorummind:
    build: .
    ports:
      - "5173:5173"
      - "8787:8787"
    environment:
      QUORUMMIND_PROVIDER_MODE: live
      QUORUMMIND_MOCK_PROVIDERS: "1"
      QUORUMMIND_API_HOST: 0.0.0.0
      QUORUMMIND_API_PORT: "8787"
      QUORUMMIND_WEB_HOST: 0.0.0.0
      QUORUMMIND_SQLITE_PATH: /data/quorummind.db
    volumes:
      - .:/app
      - /app/node_modules
      - quorummind-data:/data

volumes:
  quorummind-data:
