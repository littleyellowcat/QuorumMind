name: QuorumMind Architecture Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  review:
    if: >
      contains(github.event.comment.body, '/quorummind') ||
      contains(github.event.comment.body, '/qm')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run QuorumMind review package
        uses: ./github
        with:
          comment_body: ${{ github.event.comment.body }}
          repo: ${{ github.repository }}
          issue_number: ${{ github.event.issue.number || github.event.pull_request.number }}
          output_mode: all
          write_comment: "false"
          write_github: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
